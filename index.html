<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Pronostici · Serie A</title>
<style>
:root{
  --paper:#f3efe6; --card:#fffcf5; --ink:#16211c; --muted:#6d716a; --line:#e2dccd;
  --pitch:#1d5640; --pitch-2:#2f7a5b; --draw:#c9b98f; --away:#2b3a55; --accent:#d9481f; --gold:#b78a1c;
  --r:18px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);font-feature-settings:"tnum";
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:22px 0 10px}
.kicker{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--pitch)}
h1{font:600 34px/1.02 var(--serif);letter-spacing:-.01em;margin:8px 0 6px}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);font-size:13px}
.warn{margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:#fbe9df;border:1px solid #f1c9b6;color:#7a2d14;font-size:13px}
.warn b{font-weight:650}
.prov{margin:0 0 12px;padding:12px 14px;border-radius:14px;background:#fff4dc;border:1px solid #ecd59a;color:#6b4e0c;font-size:13px}
.tag.ucl{background:#1f2a5c;color:#fff}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px var(--sans);
  padding:8px 14px;border-radius:999px}
nav button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
section{display:none;padding-top:14px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:12px;
  box-shadow:0 1px 0 rgba(22,33,28,.04)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.tag{font:650 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:#efe9da;color:var(--muted)}
.tag.live{background:#fde5dc;color:var(--accent)} .tag.ft{background:var(--ink);color:var(--paper)} .tag.ban{background:#ece7f4;color:#4b3a78}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:12px}
.team{font:600 19px/1.1 var(--serif)} .team.r{text-align:right}
.team small{display:block;font:500 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.score{font:700 20px var(--sans);min-width:56px;text-align:center;color:var(--muted)}
.score.final{color:var(--ink)}
.bar{display:flex;height:34px;border-radius:10px;overflow:hidden;font:650 12px/34px var(--sans);color:#fff}
.bar div{text-align:center;white-space:nowrap;overflow:hidden;min-width:28px}
.bar .h{background:var(--pitch)} .bar .d{background:var(--draw);color:var(--ink)} .bar .a{background:var(--away)}
.legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:5px 2px 10px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{background:var(--paper);border-radius:10px;padding:7px 8px}
.chip span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip b{font:650 15px var(--sans)}
details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--pitch);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ＋"} details[open] summary::after{content:" －"}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;color:var(--muted);font-weight:500}
th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pos{color:var(--pitch-2);font-weight:700} .neg{color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.pick .what{font:600 16px var(--serif)} .pick .m{font-size:12px;color:var(--muted)}
.pick .odd{font:700 22px var(--sans);text-align:right}
.evpill{display:inline-block;font:700 11px var(--sans);padding:4px 7px;border-radius:6px;background:#e4f0e8;color:var(--pitch)}
.combo .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.combo .big{font:700 30px var(--sans);letter-spacing:-.02em}
.leg{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.leg:last-of-type{border-bottom:0}
.leg i{font-style:normal;color:var(--muted);font-size:12px;display:block}
.odds-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:12px}
.odds-strip div{background:var(--paper);border-radius:10px;padding:8px}
.odds-strip b{display:block;font-size:16px}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
h2{font:600 22px var(--serif);margin:4px 0 8px}
p.note{color:var(--muted);font-size:13px;margin-bottom:12px}
.method p{margin-bottom:10px;font-size:14px}
footer{color:var(--muted);font-size:11px;text-align:center;padding:18px 0}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 14px;border-radius:12px;font-size:13px;display:none}
.propbtn{margin-top:10px;width:100%;border:0;border-radius:12px;padding:11px 12px;background:var(--pitch);color:#fff;
  font:650 14px var(--sans);display:flex;justify-content:center;gap:8px;align-items:center;cursor:pointer}
.propbtn.off{background:#ece7f4;color:#4b3a78}
.sheet-bg{position:fixed;inset:0;background:rgba(22,33,28,.42);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--paper);
  border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(102%);
  transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 30px rgba(0,0,0,.12);max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font:600 21px/1.1 var(--serif);margin:0 0 2px}
.sheet .x{position:sticky;top:0;float:right;border:0;background:var(--card);border:1px solid var(--line);border-radius:50%;
  width:32px;height:32px;font-size:16px;color:var(--ink);cursor:pointer}
.cat{margin-top:14px}
.cat h4{font:650 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--pitch);margin:0 0 6px}
.prop{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 11px;margin-bottom:6px}
.prop .l{font-weight:600;font-size:14px;line-height:1.2} .prop .l i{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:2px}
.prop .pp{font:700 15px var(--sans);text-align:right;min-width:44px}
.prop .fo{font:600 12px var(--sans);color:var(--muted);text-align:right;min-width:52px}
.prop .fo b{display:block;font-size:14px;color:var(--ink)}
.meter{height:3px;border-radius:2px;background:var(--line);grid-column:1/-1;overflow:hidden;margin-top:-2px}
.meter span{display:block;height:100%;background:var(--pitch-2)}
.minor{font-size:11.5px;color:var(--muted);margin-top:8px}
.prop.sel{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s}
.prop.sel .tick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;
  font:700 13px var(--sans);color:transparent;margin-right:8px;vertical-align:middle;flex:0 0 auto;background:var(--paper)}
.prop .l{display:flex;align-items:flex-start} .prop .l > div{min-width:0}
.prop.sel[aria-pressed=true]{background:#e6f1ea;border-color:var(--pitch-2)}
.prop.sel[aria-pressed=true] .tick{background:var(--pitch);border-color:var(--pitch);color:#fff}
.prop.locked{opacity:.6}
.pick.sel{cursor:pointer} .pick.sel[aria-pressed=true]{background:#e6f1ea;border-color:var(--pitch-2)}
.addpill{display:inline-block;margin-top:6px;font:650 11px var(--sans);padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--pitch)}
.pick.sel[aria-pressed=true] .addpill{background:var(--pitch);color:#fff;border-color:var(--pitch)}
#slipbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:23;max-width:620px;margin:0 auto;
  background:var(--ink);color:var(--paper);border-radius:16px;padding:11px 14px;display:none;align-items:center;gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);cursor:pointer;border:0;font:inherit;text-align:left}
#slipbar.on{display:flex}
#slipbar .n{background:var(--accent);color:#fff;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font:700 13px var(--sans)}
#slipbar .t{flex:1;font:600 14px var(--sans)} #slipbar .t small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
#slipbar .q{font:700 18px var(--sans);text-align:right} #slipbar .q small{display:block;font:500 10px var(--sans);opacity:.7;letter-spacing:.06em;text-transform:uppercase}
body.hasslip main, body.hasslip .sheet{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.slipgrp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.slipgrp .mh{font:600 15px var(--serif)} .slipgrp .mh small{display:block;font:400 11.5px var(--sans);color:var(--muted)}
.slipsel{display:grid;grid-template-columns:1fr auto 30px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.slipsel .mk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em} .slipsel b{font-size:14px}
.slipsel .pp{text-align:right;font:700 14px var(--sans)} .slipsel .pp small{display:block;font:500 11px var(--sans);color:var(--muted)}
.rm{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:14px;cursor:pointer}
.corr{margin-top:8px;font-size:12px;line-height:1.35;background:#fff4dc;color:#7a5a12;border-radius:10px;padding:7px 9px}
.exact{margin-top:8px;font-size:12px;background:#e6f1ea;color:var(--pitch);border-radius:10px;padding:7px 9px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tot div{background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 12px} .tot span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.tot b{font:700 22px var(--sans)}
.actions{display:flex;gap:8px;margin-top:12px} .actions button{flex:1;border-radius:12px;padding:12px;font:650 14px var(--sans);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:2}
pre.share{white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px;margin-top:10px;color:var(--ink)}
#toast{z-index:30} body.hasslip #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
@media (min-width:700px){h1{font-size:42px}}
</style>
</head>

const $ = s => document.querySelector(s);
const pct = (x, d=0) => x == null ? "–" : (100*x).toFixed(d) + "%";

const sgn = x => (x >= 0 ? "+" : "−") + Math.abs(100*x).toFixed(1) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtKO = iso => new Date(iso).toLocaleString("it-IT",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
const SEL = {h:"1", d:"X", a:"2", o25:"Over 2.5", u25:"Under 2.5"};
const selName = (m, k) => k==="h" ? `1 · ${m.home}` : k==="a" ? `2 · ${m.away}` : SEL[k];
const startedNow = iso => new Date(iso) <= new Date();

function header(){
  const ko = D.matches.map(m => new Date(m.kickoff));

function matchCard(m){

const SK = "pronostici_schedina_v1", SELS = {};
const VCODE = {h: "1", d: "X", a: "2", o25: "O2.5", u25: "U2.5"};
const UCL = (D.euro && D.euro.matches) || [];
const MBY = Object.fromEntries(D.matches.concat(UCL).map(m => [String(m.id), m]));
const selId = (mid, s) => s.code ? `${mid}|T|${s.code}` : `${mid}|P|${s.label}`;
const canSelect = m => m && !m.excluded && !m.locked && !m.result && !startedNow(m.kickoff);
let slip = (() => { try { return JSON.parse(localStorage.getItem(SK) || "[]")
  .filter(s => MBY[String(s.match)] && !MBY[String(s.match)].excluded && s.id && s.p > 0); } catch (e) { return []; } })();
function pred(code){
  const o = /^([OU])(\d\.5)$/.exec(code);
  if (o) { const t = parseFloat(o[2]); return o[1] === "O" ? (i, j) => i + j > t : (i, j) => i + j < t; }
  return {"1": (i,j) => i > j, "X": (i,j) => i === j, "2": (i,j) => i < j, "1X": (i,j) => i >= j, "X2": (i,j) => i <= j,
          "12": (i,j) => i !== j, "GG": (i,j) => i > 0 && j > 0, "NG": (i,j) => !(i > 0 && j > 0)}[code];
}
function slipCalc(){
  const groups = {};
  slip.forEach(s => (groups[s.match] = groups[s.match] || []).push(s));
  let p = 1; const info = [];
  for (const mid in groups) {
    const g = groups[mid], team = g.filter(s => s.code), pl = g.filter(s => !s.code), M = MBY[mid].model && MBY[mid].model.matrix;
    let pt = 1, exact = false, approx = false;
    if (team.length === 1) pt = team[0].p;
    else if (team.length > 1 && !M) { pt = team.reduce((a, s) => a * s.p, 1); approx = true; }
    else if (team.length > 1 && M) {
      const fs = team.map(s => pred(s.code)); pt = 0; exact = true;
      M.forEach((row, i) => row.forEach((x, j) => { if (fs.every(f => f(i, j))) pt += x; }));
    }
    const pg = pt * pl.reduce((a, s) => a * s.p, 1);
    p *= pg;
    info.push({mid, sels: g, p: pg, exact, corr: approx || pl.length + (team.length ? 1 : 0) >= 2, teamN: team.length});
  }
  return {p, fair: p > 0 ? 1 / p : null, groups: info, corr: info.some(x => x.corr)};
}

    `<div class="tot"><div><span>Prob. stimata</span><b>${pct(c.p, 1)}</b></div><div><span>Quota equa totale</span><b>${fairTxt(c.fair)}</b></div></div>
    <p class="minor">Partite diverse: probabilità moltiplicate. Quota equa = 1/probabilità: se Sisal paga meno, la giocata è svantaggiosa anche se il modello avesse ragione. In media vinci circa 1 volta ogni ${c.p > 0 ? Math.round(1 / c.p) : "–"}.</p>
    <div class="actions"><button type="button" onclick="slip=[];saveSlip()">Svuota</button><button type="button" class="primary" id="sendbtn" onclick="sendToBetBot()">Invia a Bet Bot</button></div>
    <pre class="share" id="sharepre" hidden></pre>`;
}
function openSlip(){ closeProps(); renderSlip(); const el = $("#slip"); el.scrollTop = 0; el.classList.add("on"); $("#sheetbg").classList.add("on"); document.body.style.overflow = "hidden"; }
function closeSlip(){ $("#slip").classList.remove("on"); if (!$("#sheet").classList.contains("on")) { $("#sheetbg").classList.remove("on"); document.body.style.overflow = ""; } }
$("#slipbar").addEventListener("click", openSlip);
document.addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]"); if (rm) { slip = slip.filter(x => x.id !== rm.dataset.rm); saveSlip(); return; }
  const s = e.target.closest("[data-sid]"); if (s) toggleSel(s.dataset.sid);
});
document.addEventListener("keydown", e => { const s = e.target.closest && e.target.closest("[data-sid]"); if (s && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleSel(s.dataset.sid); } });

const ROLE = {DEF:"difensore", MID:"centrocampista", ATT:"attaccante"};
function propRow(s, m){
  const who = s.who ? `<i>${esc(s.who.team)} · ${ROLE[s.who.role]||s.who.role} · ~${s.who.expmin}′ attesi</i>` : "";
  const id = selId(m.id, s), open = canSelect(m);
  SELS[id] = {id, match: m.id, label: s.label, market: s.market || "", code: s.code || null, p: s.p, fair: s.fair, odds: s.odds || null,
              oddsSrc: s.odds ? (m.provider || "bookmaker") : null, src: "Proponi quote"};
  const on = slip.some(x => x.id === id);
  return `<div class="prop ${open?'sel':'locked'}" ${open?`data-sid="${esc(id)}" role="button" tabindex="0" aria-pressed="${on}"`:''}><div class="l">${open?'<span class="tick">✓</span>':''}<div>${esc(s.label)}${who}</div></div><div class="pp">${pct(s.p)}</div>
    <div class="fo">${s.odds ? `quota ${esc(m.provider||"")}<b>${odd(s.odds)}</b>` : `quota equa<b>${s.fair==null?'–':s.fair.toFixed(2)}</b>`}</div><div class="meter"><span style="width:${100*s.p}%"></span></div></div>`;
}
function openProps(id){
  const m = MBY[String(id)], P = m.props, sh = $("#sheet"), EU = !!m.comp;
  const head = `<div class="grab"></div><button class="x" aria-label="Chiudi" onclick="closeProps()">✕</button>
    <div class="kicker">Proponi quote${m.comp ? " · " + esc(m.comp_name) : ""}</div><h3 id="sheettitle">${esc(m.home)} – ${esc(m.away)}</h3><div class="sub">${fmtKO(m.kickoff)}</div>`;
  if (!P) {
    sh.innerHTML = head + `<div class="card empty" style="margin-top:14px">Nessuna proposta.<br><span class="minor">Per regola non propongo selezioni sulle partite di ${D.excluded.join(", ")}, né sui loro giocatori.</span></div>`;
  } else {
    const cat = (t, xs, note="") => xs.length ? `<div class="cat"><h4>${t}</h4>${xs.map(x => propRow(x, m)).join("")}${note}</div>` : "";
    const done = m.result || startedNow(m.kickoff);
    sh.innerHTML = head +
      `<p class="note" style="margin:10px 0 0">${canSelect(m) ? "<b>Tocca una selezione</b> per aggiungerla alla schedina. " : ""}${EU ? `Le selezioni più probabili <b>secondo il mercato</b> (quote ${esc(m.provider||"")} senza margine), non secondo il nostro modello. Dove c'è la quota reale la mostro; doppia chance = somma delle probabilità di mercato; altre linee Under/Over e Gol/No Gol = distribuzione di Poisson adattata alle quote (quota equa = 1/probabilità). Probabile ≠ conveniente.` : `Le selezioni più probabili secondo il modello, con <b>quota equa</b> = 1/probabilità: se il bookmaker paga meno, la giocata è svantaggiosa anche se il modello fosse giusto. Probabile ≠ conveniente.`}${done ? " <b>Partita già iniziata o giocata: stime pre-partita, non selezionabili.</b>" : ""}</p>` +
      cat("Esito (1X2 e doppia chance)", P.esito) + cat("Under / Over", P.gol) + cat("Gol / No Gol", P.gg) +
      (EU && P.n_players ? `<p class="minor" style="margin-top:12px"><b>Giocatori solo per ${esc((P.players_for||[]).join(", "))}</b>: dati Understat di Serie A (stagione corrente + precedente), scalati sui gol attesi dal mercato per questa partita. Nessun dato giocatori gratuito per ${esc([m.home, m.away].filter(t => !(P.players_for||[]).includes(t)).join(", "))}. Cartellini: arbitri e metro europeo non considerati.</p>` : "") +
      (P.n_players ? cat("Tiri totali", P.tiri) + cat("Tiri in porta", P.porta) + cat("Ammonizioni", P.cartellini,
        `<p class="minor">Nessun fattore arbitro: designazioni e statistiche arbitrali non disponibili gratis in formato utilizzabile.</p>`) +
      `<p class="minor"><b>Titolari probabili</b>, non ufficiali: giocatori con almeno 45′ di media nelle ultime 5 partite della squadra (infortuni e squalifiche non noti, salvo espulsione nell'ultima). Per i giocatori non ci sono quote bookmaker gratuite: solo quota equa.</p>`
       : `<p class="minor">${EU ? "<b>Dati giocatori non disponibili</b> per questa partita: ho dati giocatori gratuiti (Understat) solo per le squadre di Serie A. Niente ammoniti né tiri, invece di inventarli." : "Dati giocatori non disponibili per questa partita."}</p>`) +
      `<p class="minor">Selezioni nella stessa partita sono correlate: non moltiplicare le probabilità. Stime, non certezze; nessuna vincita garantita. 18+.</p>`;
  }
  sh.scrollTop = 0; sh.classList.add("on"); $("#sheetbg").classList.add("on"); document.body.style.overflow = "hidden";
}
function closeProps(){ $("#sheet").classList.remove("on"); if (!$("#slip").classList.contains("on")) { $("#sheetbg").classList.remove("on"); document.body.style.overflow = ""; } }
document.addEventListener("click", e => { const b = e.target.closest("[data-prop]"); if (b) openProps(b.dataset.prop); });
$("#sheetbg").addEventListener("click", () => { closeProps(); closeSlip(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeProps(); closeSlip(); } });

document.querySelectorAll("nav button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === b.dataset.t));
  window.scrollTo({top: 0, behavior: "smooth"});
}));

async function checkVersion(){
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) return;
    const v = await r.json();
    if (v.version && v.version !== BUILD_VERSION) {
      const t = $("#toast"); t.textContent = "Nuovi dati disponibili, aggiorno…"; t.style.display = "block";
      setTimeout(() => location.reload(), 800);
    }
  } catch (e) { /* offline: keep current page */ }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setInterval(checkVersion, 60000);

header(); renderMatches(); renderValue(); renderCombos(); renderUCL(); renderMethod(); renderSlipBar(); checkVersion();
</script>
</body>
</html>
